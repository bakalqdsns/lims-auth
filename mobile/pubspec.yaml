name: lims_mobile
description: 实验室管理系统 - 移动客户端

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.0

  # State management & routing
  get: ^4.6.6

  # Local storage
  shared_preferences: ^2.2.2

  # Date/time
  intl: ^0.19.0

  # Excel import/export
  excel: ^4.0.6
  file_picker: ^8.1.6
  path_provider: ^2.1.5

  # Charts
  fl_chart: ^0.66.2

  # UI utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
